services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost/api
    networks:
      - ksi-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  backend:
    build:
      context: ./backend
    ports:
      - '8001:8000'
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - ksi-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - ksi-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  mongo_data:

networks:
  ksi-net:
    driver: bridge
